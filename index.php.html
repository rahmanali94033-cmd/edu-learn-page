<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduLearn Elite</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;font-family:'Outfit',sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 20%,#1e1b4b,#0f172a 60%);display:flex;justify-content:center;align-items:center;padding:20px}.card{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);width:100%;max-width:440px;border-radius:28px;padding:32px}.badge{background:linear-gradient(90deg,#facc15,#eab308);color:#000;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700}h1{color:#fff;font-size:28px;margin:14px 0 6px}p{color:#94a3b8;font-size:13px;margin-bottom:20px}input{width:100%;margin-top:10px;padding:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;color:#fff}button{width:100%;margin-top:18px;padding:15px;background:linear-gradient(90deg,#facc15,#fde047);border:none;border-radius:14px;font-weight:700;cursor:pointer}</style></head><body>
<div class="card"><span class="badge">PREMIUM ACCESS</span><h1>Join EduLearn Elite.</h1><p>Exclusive Learning Community - Step 1 of 2</p>
<form action="dob.html" onsubmit="localStorage.setItem('name',this.name.value);localStorage.setItem('email',this.email.value);localStorage.setItem('mobile',this.mobile.value);">
<input name="name" placeholder="Full Name" required>
<input name="email" type="email" placeholder="Email Address" required>
<input name="mobile" type="tel" placeholder="Mobile Number" pattern="[0-9]{10}" required>
<button>Continue to Final Step →</button></form></div></body></html>
